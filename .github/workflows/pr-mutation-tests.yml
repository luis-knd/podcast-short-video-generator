name: PR - Mutation Tests

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/**"
      - "requirements*.txt"

permissions:
  contents: read

concurrency:
  group: pr-mutation-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  mutation_tests:
    if: ${{ github.event.pull_request.base.ref == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show mutmut version
        run: python3 -c "import mutmut; print(f'mutmut=={mutmut.__version__}')"

      - name: Patch mutmut for src-as-package layout
        run: |
          python3 << 'PYEOF'
          import pathlib
          import mutmut

          pkg = pathlib.Path(mutmut.__file__).resolve().parent
          main_path = pkg / '__main__.py'
          trampoline_path = pkg / 'trampoline_templates.py'

          main_text = main_path.read_text()
          normalized_record_hit = (
              "def record_trampoline_hit(name):\n"
              "    if name.startswith('src.'):\n"
              "        name = name[len('src.'):]\n"
          )
          if normalized_record_hit not in main_text:
              unpatched_record_hit = "def record_trampoline_hit(name):\n"
              if unpatched_record_hit not in main_text:
                  raise RuntimeError(
                      "Could not find record_trampoline_hit() in mutmut.__main__.py; "
                      "review the src-layout compatibility patch before bumping mutmut."
                  )
              main_text = main_text.replace(unpatched_record_hit, normalized_record_hit, 1)
              main_path.write_text(main_text)

          trampoline_text = trampoline_path.read_text()
          replacements = {
              "record_trampoline_hit(orig.__module__ + '.' + orig.__name__)": (
                  "record_trampoline_hit(orig.__module__.removeprefix('src.') + '.' + orig.__name__)"
              ),
              "prefix = orig.__module__ + '.' + orig.__name__ + '__mutmut_'": (
                  "prefix = orig.__module__.removeprefix('src.') + '.' + orig.__name__ + '__mutmut_'"
              ),
          }
          for old, new in replacements.items():
              if new in trampoline_text:
                  continue
              if old not in trampoline_text:
                  raise RuntimeError(
                      f"Could not find expected mutmut trampoline fragment: {old!r}. "
                      "Review the compatibility patch before bumping mutmut."
                  )
              trampoline_text = trampoline_text.replace(old, new)
          trampoline_path.write_text(trampoline_text)
          print(f'Patched mutmut src-layout compatibility in {pkg}')
          PYEOF

      - name: Detect changed source files
        id: changed
        run: |
          BASE="origin/${{ github.event.pull_request.base.ref }}"
          CHANGED=$(git diff --name-only --diff-filter=ACMR "$BASE" HEAD -- 'src/' | grep '\.py$' || true)
          if [ -z "$CHANGED" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "$CHANGED" > /tmp/changed_src_files.txt
            echo "Changed source files:"
            cat /tmp/changed_src_files.txt
          fi

      - name: Scope mutations to mutatable changed files
        id: mutatable
        if: steps.changed.outputs.skip == 'false'
        run: |
          python3 << 'PYEOF'
          import configparser
          import os
          import pathlib

          from mutmut.file_mutation import mutate_file_contents

          github_output = pathlib.Path(os.environ['GITHUB_OUTPUT'])

          changed = pathlib.Path('/tmp/changed_src_files.txt').read_text().strip().splitlines()
          changed = [f for f in changed if f]
          mutatable = []
          skipped = []

          for file_path in changed:
              mutant_names = mutate_file_contents(file_path, pathlib.Path(file_path).read_text())[1]
              if mutant_names:
                  mutatable.append(file_path)
                  print(f"MUTATABLE {file_path}: {len(mutant_names)} mutants")
              else:
                  skipped.append(file_path)
                  print(f"SKIP {file_path}: mutmut generated 0 mutants")

          if not mutatable:
              with open(github_output, 'a') as output:
                  output.write('skip=true\n')
              print('No mutatable changed files detected; skipping mutation run.')
              raise SystemExit(0)

          cfg = configparser.ConfigParser()
          cfg.read('setup.cfg')
          cfg.set('mutmut', 'paths_to_mutate', '\n' + '\n'.join(mutatable))

          with open('setup.cfg', 'w') as f:
              cfg.write(f)

          print("Scoped [mutmut] paths_to_mutate:")
          for p in mutatable:
              print(f"  {p}")
          if skipped:
              print("Skipped changed files without generated mutants:")
              for p in skipped:
                  print(f"  {p}")

          with open(github_output, 'a') as output:
              output.write('skip=false\n')
          PYEOF

      - name: Run mutation tests
        if: steps.changed.outputs.skip == 'false' && steps.mutatable.outputs.skip == 'false'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: mutmut run

      - name: Check mutation coverage
        if: steps.changed.outputs.skip == 'false' && steps.mutatable.outputs.skip == 'false'
        run: |
          mutmut export-cicd-stats
          python3 << 'PYEOF'
          import json, sys

          with open('mutants/mutmut-cicd-stats.json') as f:
              stats = json.load(f)

          killed = stats.get('killed', 0)
          survived = stats.get('survived', 0)
          timeout = stats.get('timeout', 0)
          suspicious = stats.get('suspicious', 0)
          total = killed + survived + timeout + suspicious

          if total == 0:
              print('No mutations found')
              sys.exit(0)

          score = (killed + timeout) * 100 / total
          print(f'Mutation score: {score:.2f}%')
          print(f'Killed: {killed}, Survived: {survived}, Timeout: {timeout}, Suspicious: {suspicious}')

          if score < 90:
              print(f'ERROR: Mutation coverage {score:.2f}% is below 90%')
              sys.exit(1)
          PYEOF
